# ============================================
# Netlify Configuration for Al-Zahran Law Firm
# ============================================

[build]
  # Tell Netlify the site is in the root directory
  publish = "."
  # No build command needed for pure static HTML/CSS/JS
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
